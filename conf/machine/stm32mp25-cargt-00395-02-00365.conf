#@TYPE: Machine
#@NAME: stm32mp25-00395-02-00365
#@DESCRIPTION: Configuration for Cargt 00395-02 SOM on Cargt 00365 Carrier Board
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python layers/meta-st/meta-st-cargt layers/meta-st/meta-cargt-stm32mp-addons

###########################################################################
#
# Default machine configuration sections
#
###########################################################################

# Define specific common machine name
MACHINEOVERRIDES =. "stm32mpcommonmx:stm32mp2commonmx:stm32mp25commonmx:"
MACHINEOVERRIDES =. "stm32mp2common:stm32mp25common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

# =========================================================================
# Chip architecture
# =========================================================================
DEFAULTTUNE = "cortexa35"
include conf/machine/include/arm/armv8a/tune-cortexa35.inc

# =========================================================================
# boot scheme
# =========================================================================
BOOTSCHEME_LABELS += "optee"
BOOTSCHEME_LABELS += "fastboot"

# =========================================================================
# boot device
# =========================================================================
BOOTDEVICE_LABELS += "emmc"
BOOTDEVICE_LABELS += "sdcard"

# =========================================================================
# Machine settings
# =========================================================================
# Enable the board device storage support with CUBEMX_DTB
STM32MP_DT_FILES_NAND      += "${CUBEMX_DTB}"
STM32MP_DT_FILES_NOR_all   += "${CUBEMX_DTB}"
STM32MP_DT_FILES_NOR_mb    += "${CUBEMX_DTB}"
STM32MP_DT_FILES_NOR_mb_sb += "${CUBEMX_DTB}"
STM32MP_DT_FILES_EMMC      += "${CUBEMX_DTB}"
STM32MP_DT_FILES_SDCARD    += "${CUBEMX_DTB}"
STM32MP_DT_FILES_SPINAND   += "${CUBEMX_DTB}"

STM32MP_DT_FILES_EMMC      += "${CUBEMX_DTB}-glt028240320is1"
STM32MP_DT_FILES_SDCARD    += "${CUBEMX_DTB}-glt028240320is1"

STM32MP_DT_FILES_EMMC      += "${CUBEMX_DTB}-glt0557201280is1"
STM32MP_DT_FILES_SDCARD    += "${CUBEMX_DTB}-glt0557201280is1"

STM32MP_DT_FILES_EMMC      += "${CUBEMX_DTB}-glt0701024600is2"
STM32MP_DT_FILES_SDCARD    += "${CUBEMX_DTB}-glt0701024600is2"

STM32MP_DT_FILES_EMMC      += "${CUBEMX_DTB}-glt1011280800is1"
STM32MP_DT_FILES_SDCARD    += "${CUBEMX_DTB}-glt1011280800is1"

# =========================================================================
# Machine features (default for stm32mp2 like)
# =========================================================================
# MACHINE_FEATURES += "splashscreen"
MACHINE_FEATURES += "00395 00365"
MACHINE_FEATURES += "watchdog"
MACHINE_FEATURES += "${@'gpu' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"

# CARGT - Enable trace debugging to stdout with the following
# ST_DEBUG_TRACE = "1"

# =========================================================================
# fip
# =========================================================================
FIP_BL31_ENABLE = "1"

# =========================================================================
# Flashlayout
# =========================================================================
# Set the FLASHLAYOUT_TYPE_LABELS for 'extensible' to CUBEMX_DTB
FLASHLAYOUT_TYPE_LABELS:extensible = "${CUBEMX_DTB}"

# ==========================================================================
# M33 Copro
# ==========================================================================
# Set M33_TZ configuration
CUBEMX_M33_TZ ?= "0"
M33PROJECT_TF_M_TRUSTZONE = "${@bb.utils.contains('MACHINE_FEATURES', 'm33td', '0', '${CUBEMX_M33_TZ}', d)}"

# =========================================================================
# CubeMX extra config
# =========================================================================
ENABLE_CUBEMX_DTB ?= "1"

###########################################################################
#
# User machine customization sections
#
###########################################################################

# Boot Scheme
# =========================================================================
BOOTSCHEME_LABELS += "optee"
BOOTSCHEME_LABELS += "opteemin"
BOOTSCHEME_LABELS += "fastboot"
BOOTSCHEME_LABELS += "fastboot-opteemin"

# Boot Device Choice
# =========================================================================
# Define the boot device supported
BOOTDEVICE_LABELS += "sdcard"
BOOTDEVICE_LABELS += "emmc"
#BOOTDEVICE_LABELS += "nand-4-256-1024"
#BOOTDEVICE_LABELS += "nor-sdcard"

# Support Feature Choice
# =========================================================================
# Define the features to enable on board
MACHINE_FEATURES += "bluetooth"
#MACHINE_FEATURES += "wifi"
#MACHINE_FEATURES += "m33td"
MACHINE_FEATURES += "nxpwifi-nxpiw610-sdio"

# Specific firmwares and kernel modules configuration
# =========================================================================
# Set the list of kernel module to be auto-loaded during boot
#KERNEL_MODULE_AUTOLOAD += ""

# Set Bluetooth related package list needed when 'bluetooth' feature is enabled
#BLUETOOTH_LIST += ""

# Set Wifi related package list needed when 'wifi' feature is enabled
#WIFI_LIST += ""

# CubeMX Project Config
# =========================================================================
# Assign CubeMX Board devicetree and project path name
CUBEMX_DTB = "stm32mp257f-cargt-00395-02-00365"
CUBEMX_PROJECT = "cargt-00395-02-00365"
CUBEMX_PROJECT_NAME = "cargt-00395-02-00365"

# Indicate if M33 co-processor is used with Trustzone enabled or not
#CUBEMX_M33_TZ = "0"

# Kernel image package fix
# =========================================================================
# st-machine-common-stm32mp.inc clears RDEPENDS:${KERNEL_PACKAGE_NAME}-base
# ("Don't include kernels in standard images") but kernel.bbclass's default
# RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base still pulls in the fat
# kernel-image-<KV> package (full uncompressed Image + System.map +
# Module.symvers + config), which duplicates content already provided by
# the lean kernel-imagebootfs package (Image.gz + dtb, the only files
# actually referenced by the extlinux boot chain). /boot is sized for
# kernel-imagebootfs alone, so any apt upgrade that touches
# kernel-image-<KV> fails with ENOSPC. Clear the recommendation so
# kernel-image-<KV> is never installed on target.
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base = ""

# =========================================================================
# Flashlayout rootfs size (fastboot/SD card) - give rootfs enough room for
# package installation and development work.
# NOTE: eMMC on this board is a hard 4GiB total, so it keeps ST's default
# 3GiB rootfs size (see st-machine-flashlayout-stm32mp.inc) rather than
# being bumped here - 6GiB would exceed the entire chip's capacity.
# =========================================================================
FLASHLAYOUT_PARTITION_SIZE:sdcard:${STM32MP_ROOTFS_LABEL} = "6291456"

# =========================================================================
# WIC for sdcard raw image
# =========================================================================
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
WKS_FILE_DEPENDS ?= " \
    virtual/bootloader \
    virtual/trusted-firmware-a \
    virtual-optee-os \
    ${@bb.utils.contains('ST_BOOTFS','1','st-image-bootfs', '', d)} \
    ${@bb.utils.contains('ST_VENDORFS','1','st-image-vendorfs', '', d)} \
    ${@bb.utils.contains('ST_USERFS','1','st-image-userfs', '', d)} \
"
OPTEE_WIC_FILE = "${@bb.utils.contains('ST_VENDORFS','1','sdcard-stm32mp257f-cargt-00395-02-00365-optee-vendorfs-2GB.wks.in','sdcard-stm32mp257f-cargt-00395-02-00365-optee-2GB.wks.in',d)}"

WKS_IMAGE_FSTYPES += "wic wic.bz2 wic.bmap"
WKS_FILE += "${OPTEE_WIC_FILE}"
